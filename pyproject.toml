[project]
name = "fastapi-app"
version = "1.0.0"
description = "AI 智能客服产品：server（FastAPI + RAG Core + LangGraph 编排）+ web（React 客服工作台）"
readme = "README.md"
# 开发/容器统一 Python 3.12；元数据兼容范围为 3.10-3.12。
# 版本选择源于本地 fastembed/onnxruntime 的历史兼容问题，见 README「Python 与依赖约束」。
requires-python = ">=3.10,<3.13"
dependencies = [
    # 后端依赖统一由 server/ 子项目声明（见 server/pyproject.toml）
    "server",
]

[tool.uv.workspace]
members = [
    "server",
]
