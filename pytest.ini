# 统一 pytest 入口：一条命令跑全量测试（server 包：RAG core + LangGraph 图 + FastAPI 接口）
# 用法：在仓库根目录执行 server/.venv/bin/python -m pytest
# server/pyproject.toml 里已配 pythonpath=["src"]，包内 import 用 from server.xxx
[pytest]
testpaths = server/tests
python_files = test_*.py
addopts = -q --tb=short
pythonpath = server/src
